<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Academy Smart Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
:root{
  --maroon:#821e40;
  --maroon-dark:#3c1020;
  --gold:#edb64d;
  --gold-light:#ffe2a7;
  --bg:#f7f7fb;
  --card:#fff;
  --text:#20202b;
  --muted:#6f7180;
  --border:#e6e6ee;
  --green:#177c50;
  --red:#c63b4b;
  --orange:#c87808;
  --blue:#3158c7;
  --shadow:0 12px 30px rgba(48,23,36,.08);
  --shadow-hover:0 18px 38px rgba(48,23,36,.13);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Segoe UI",Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button,
input,
select,
textarea{
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease,transform .18s ease;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
  outline:3px solid rgba(237,182,77,.38);
  outline-offset:2px;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,var(--maroon-dark),var(--maroon));
}

.login-box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:18px;
  padding:35px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.login-logo{
  width:90px;
  height:90px;
  object-fit:cover;
  display:block;
  margin:0 auto 18px;
  border-radius:18px;
  border:3px solid var(--gold);
}

.login-title{
  text-align:center;
  color:var(--maroon);
  font-size:24px;
  font-weight:800;
}

.login-subtitle{
  text-align:center;
  color:var(--muted);
  margin:8px 0 28px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--maroon);
  box-shadow:0 0 0 4px rgba(130,30,64,.10);
}

.primary-btn{
  border:0;
  background:var(--maroon);
  color:#fff;
  padding:12px 18px;
  border-radius:9px;
  font-weight:700;
}

.primary-btn:hover{
  background:var(--maroon-dark);
  transform:translateY(-1px);
}

.gold-btn{
  border:0;
  background:var(--gold);
  color:#2b1c00;
  padding:12px 18px;
  border-radius:9px;
  font-weight:700;
}

.secondary-btn{
  border:1px solid var(--border);
  background:#fff;
  padding:10px 15px;
  border-radius:8px;
  font-weight:700;
}

.secondary-btn:hover{
  border-color:rgba(130,30,64,.28);
  background:#fff8fa;
  color:var(--maroon);
}

.danger-btn{
  border:0;
  background:var(--red);
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-weight:700;
}

.success-btn{
  border:0;
  background:var(--green);
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-weight:700;
}

.small-btn{
  padding:7px 10px;
  font-size:12px;
}

/* APP */

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:260px;
  background:var(--maroon-dark);
  color:#fff;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
  z-index:100;
}

.brand{
  padding:20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.admin-brand-logo{
  width:42px;
  height:42px;
  border-radius:10px;
  object-fit:cover;
  border:2px solid var(--gold);
  background:#fff;
  flex-shrink:0;
}

.brand-title{
  font-weight:800;
  font-size:15px;
}

.brand-sub{
  font-size:11px;
  opacity:.7;
  margin-top:3px;
}

.user-box{
  padding:16px 20px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.user-name{
  font-weight:700;
}

.user-role{
  color:var(--gold-light);
  font-size:12px;
  margin-top:4px;
  text-transform:uppercase;
}

.nav{
  padding:12px;
}

.nav-section{
  color:#caaeb6;
  font-size:10px;
  text-transform:uppercase;
  padding:14px 10px 7px;
  font-weight:800;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  text-align:left;
  padding:11px 12px;
  border-radius:8px;
  margin-bottom:3px;
  font-weight:600;
}

.nav button:hover,
.nav button.active{
  background:rgba(255,255,255,.12);
}

.logout{
  margin:15px 12px;
  width:calc(100% - 24px);
  padding:11px;
  border:1px solid rgba(255,255,255,.25);
  color:white;
  background:transparent;
  border-radius:8px;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
}

.page-title{
  font-size:21px;
  font-weight:800;
}

.content{
  padding:25px;
}

/* CARDS */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:20px;
}

.stat-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.stat-value{
  font-size:30px;
  font-weight:800;
  margin-top:8px;
  color:var(--maroon);
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  box-shadow:var(--shadow);
  padding:20px;
}

.card-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:16px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.toolbar input,
.toolbar select{
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
}

/* TABLE */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
}

th{
  background:#fafafa;
  font-weight:800;
}

tr:hover td{
  background:#fcfcfc;
}

/* BADGES */

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:30px;
  font-size:11px;
  font-weight:800;
}

.badge-present{
  background:#d9f4e4;
  color:#126b38;
}

.badge-late{
  background:#fff0c7;
  color:#8b5a00;
}

.badge-absent{
  background:#ffe0e3;
  color:#a3192a;
}

.badge-timeout{
  background:#dce8ff;
  color:#174ba5;
}

.badge-active{
  background:#d9f4e4;
  color:#126b38;
}

.badge-inactive{
  background:#eee;
  color:#666;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:300;
}

.modal-box{
  background:white;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:15px;
  padding:24px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-title{
  font-size:20px;
  font-weight:800;
  color:var(--maroon);
}

.close-btn{
  border:0;
  background:#eee;
  width:34px;
  height:34px;
  border-radius:50%;
  font-size:20px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

/* PROFILE */

.profile-header{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:20px;
}

.profile-photo{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
  border:3px solid var(--gold);
}

.profile-name{
  font-size:25px;
  font-weight:800;
}

.profile-meta{
  color:var(--muted);
  margin-top:5px;
}

/* RFID */

.rfid-box{
  text-align:center;
  padding:30px;
  border:2px dashed var(--gold);
  border-radius:13px;
  background:#fffaf0;
}

.rfid-icon{
  font-size:45px;
  margin-bottom:12px;
}

.rfid-status{
  font-size:20px;
  font-weight:800;
  color:var(--maroon);
}

.recent-list{
  list-style:none;
}

.recent-list li{
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

/* TOAST */

.toast-container{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:500;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.toast{
  min-width:280px;
  max-width:380px;
  background:#222;
  color:#fff;
  padding:14px 17px;
  border-radius:9px;
  box-shadow:var(--shadow);
}

.toast.success{
  background:var(--green);
}

.toast.error{
  background:var(--red);
}

.toast.warning{
  background:var(--orange);
  color:#222;
}

/* MOBILE */

.mobile-menu{
  display:none;
  border:0;
  background:transparent;
  font-size:25px;
}

@media(max-width:1000px){
  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-3{
    grid-template-columns:1fr;
  }
}

@media(max-width:750px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .grid-2{
    grid-template-columns:1fr;
  }

  .stats-grid{
    grid-template-columns:1fr;
  }

  .content{
    padding:15px;
  }

  .topbar{
    padding:0 15px;
  }
}

/* =========================================================
   EXPERIENCE REFINEMENTS
========================================================= */

html{
  scroll-behavior:smooth;
}

.login-screen{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 12%,rgba(237,182,77,.24),transparent 28%),
    radial-gradient(circle at 88% 88%,rgba(255,255,255,.10),transparent 32%),
    linear-gradient(135deg,#260a16 0%,var(--maroon-dark) 42%,var(--maroon) 100%);
}

.login-screen::before,
.login-screen::after{
  content:"";
  position:absolute;
  border:1px solid rgba(255,255,255,.10);
  border-radius:50%;
  pointer-events:none;
}

.login-screen::before{
  width:34rem;
  height:34rem;
  top:-19rem;
  right:-10rem;
}

.login-screen::after{
  width:26rem;
  height:26rem;
  bottom:-16rem;
  left:-9rem;
}

.login-box{
  position:relative;
  z-index:1;
  max-width:440px;
  padding:40px;
  border:1px solid rgba(255,255,255,.68);
  border-radius:24px;
  box-shadow:0 30px 70px rgba(21,4,10,.33);
}

.login-logo{
  width:82px;
  height:82px;
  padding:3px;
  border-radius:22px;
  border:0;
  box-shadow:0 8px 18px rgba(60,16,32,.14);
}

.login-title{
  font-size:1.55rem;
  letter-spacing:-.035em;
}

.login-subtitle{
  font-size:.94rem;
  margin:8px 0 30px;
}

.form-group label{
  color:#373741;
  font-size:.86rem;
}

.form-group input,
.form-group select,
.form-group textarea{
  min-height:46px;
  padding:11px 13px;
  border-color:#dedee7;
  border-radius:10px;
  color:var(--text);
}

.form-group input::placeholder,
.toolbar input::placeholder{
  color:#a0a0ad;
}

.primary-btn,
.gold-btn,
.secondary-btn,
.danger-btn,
.success-btn{
  min-height:40px;
  border-radius:10px;
  box-shadow:0 2px 4px rgba(40,20,28,.05);
}

.primary-btn{
  background:linear-gradient(135deg,#941f49,var(--maroon));
  box-shadow:0 8px 16px rgba(130,30,64,.20);
}

.gold-btn{
  color:#3c2410;
  background:linear-gradient(135deg,#f8c866,var(--gold));
}

.danger-btn:hover,
.success-btn:hover,
.gold-btn:hover{
  filter:brightness(.96);
  transform:translateY(-1px);
}

.sidebar{
  width:276px;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 10% -5%,rgba(237,182,77,.24),transparent 28%),
    linear-gradient(180deg,#3d1021 0%,#250915 100%);
  box-shadow:10px 0 32px rgba(44,12,25,.10);
}

.brand{
  min-height:88px;
  padding:20px 22px;
  gap:13px;
  border-color:rgba(255,255,255,.10);
}

.admin-brand-logo{
  width:44px;
  height:44px;
  padding:2px;
  border:0;
  border-radius:13px;
  box-shadow:0 5px 14px rgba(0,0,0,.20);
}

.brand-title{
  letter-spacing:-.01em;
}

.brand-sub{
  color:var(--gold-light);
  opacity:.88;
  letter-spacing:.03em;
}

.user-box{
  position:relative;
  margin:14px 12px 4px;
  padding:13px 14px 13px 48px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  background:rgba(255,255,255,.07);
}

.user-box::before{
  content:"";
  position:absolute;
  left:14px;
  top:50%;
  width:22px;
  height:22px;
  border:2px solid var(--gold);
  border-radius:50%;
  transform:translateY(-50%);
}

.user-name{
  overflow:hidden;
  font-size:.9rem;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-role{
  margin-top:2px;
  color:var(--gold-light);
  letter-spacing:.08em;
}

.nav{
  flex:1;
  padding:10px 12px 18px;
}

.nav-section{
  padding:19px 10px 7px;
  color:#d4acb9;
  font-size:.62rem;
  letter-spacing:.12em;
}

.nav button{
  position:relative;
  display:flex;
  align-items:center;
  min-height:42px;
  margin-bottom:3px;
  padding:10px 12px 10px 16px;
  color:rgba(255,255,255,.83);
  border:1px solid transparent;
  border-radius:10px;
  font-size:.9rem;
}

.nav button::before{
  content:"";
  width:6px;
  height:6px;
  margin-right:11px;
  border:1px solid currentColor;
  border-radius:50%;
  opacity:.65;
}

.nav button:hover{
  background:rgba(255,255,255,.09);
  color:#fff;
}

.nav button.active{
  color:#fff;
  border-color:rgba(237,182,77,.18);
  background:linear-gradient(90deg,rgba(237,182,77,.23),rgba(255,255,255,.08));
  box-shadow:inset 3px 0 0 var(--gold);
}

.nav button.active::before{
  border-color:var(--gold);
  background:var(--gold);
  opacity:1;
  box-shadow:0 0 0 3px rgba(237,182,77,.12);
}

.logout{
  min-height:42px;
  margin:16px 12px 20px;
  border-color:rgba(255,255,255,.18);
  border-radius:10px;
  color:rgba(255,255,255,.9);
}

.logout:hover{
  border-color:rgba(237,182,77,.55);
  background:rgba(255,255,255,.08);
}

.main{
  margin-left:276px;
  width:calc(100% - 276px);
  min-width:0;
}

.topbar{
  height:78px;
  padding:0 32px;
  border-color:rgba(230,230,238,.92);
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(14px);
}

.topbar-leading,
.topbar-actions{
  display:flex;
  align-items:center;
}

.topbar-leading{
  gap:14px;
  min-width:0;
}

.topbar-title-wrap{
  min-width:0;
}

.topbar-kicker{
  color:var(--maroon);
  font-size:.66rem;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.page-title{
  overflow:hidden;
  font-size:1.32rem;
  letter-spacing:-.025em;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.topbar-actions{
  gap:14px;
}

.topbar-date{
  padding-right:14px;
  border-right:1px solid var(--border);
  color:var(--muted);
  font-size:.8rem;
  font-weight:600;
  white-space:nowrap;
}

#topUser{
  position:relative;
  display:flex;
  align-items:center;
  max-width:210px;
  min-height:40px;
  padding:8px 12px 8px 38px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
  color:#393945;
  font-size:.86rem;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
  box-shadow:0 3px 8px rgba(39,25,32,.04);
}

#topUser::before{
  content:"";
  position:absolute;
  left:9px;
  top:50%;
  width:22px;
  height:22px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#f8d27f);
  box-shadow:inset 0 0 0 4px #fff;
  transform:translateY(-50%);
}

.content{
  max-width:1540px;
  margin:0 auto;
  padding:30px 32px 42px;
}

.stats-grid{
  grid-template-columns:repeat(auto-fit,minmax(185px,1fr));
  gap:18px;
  margin-bottom:22px;
}

.stat-card{
  position:relative;
  overflow:hidden;
  min-height:128px;
  padding:21px;
  border-color:#e8e6eb;
  border-radius:16px;
  box-shadow:0 5px 16px rgba(48,23,36,.045);
}

.stat-card::after{
  content:"";
  position:absolute;
  top:0;
  right:21px;
  left:21px;
  height:3px;
  border-radius:0 0 5px 5px;
  background:linear-gradient(90deg,var(--maroon),var(--gold));
  opacity:.85;
}

.stat-card:hover,
.card:hover{
  border-color:rgba(130,30,64,.16);
  box-shadow:var(--shadow-hover);
}

.stat-label{
  margin-top:7px;
  color:var(--muted);
  font-size:.75rem;
  letter-spacing:.02em;
  text-transform:uppercase;
}

.stat-value{
  margin-top:7px;
  color:var(--maroon-dark);
  font-size:2rem;
  line-height:1.15;
  letter-spacing:-.045em;
}

.grid-2,
.grid-3{
  gap:20px;
}

.card{
  padding:23px;
  border-color:#e8e6eb;
  border-radius:16px;
  box-shadow:0 5px 16px rgba(48,23,36,.045);
}

.card-title{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:18px;
  color:#2e2026;
  font-size:1.02rem;
  letter-spacing:-.01em;
}

.card-title::before{
  content:"";
  width:4px;
  height:18px;
  border-radius:999px;
  background:linear-gradient(180deg,var(--gold),var(--maroon));
}

.toolbar{

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://uyxyiktqgrpcdgccoigo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_HNeDdoOj0y2776d6XkNZlg_SuQ53-RG";

const EDGE_FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/clever-action";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

const state = {
  user:null,
  profile:null,
  students:[],
  teachers:[],
  subjects:[],
  rooms:[],
  attendance:[],
  correctionRequests:[],
  grades:[],

};


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function showToast(message,type=""){

  const container =
    document.getElementById("toastContainer");

  const toast =
    document.createElement("div");

  toast.className =
    "toast " + type;

  toast.textContent =
    message;

  container.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },3500);
}


function openModal(html){

  state.lastFocusedElement =
    document.activeElement instanceof HTMLElement
      ? document.activeElement
      : null;

  document.getElementById(
    "modalBox"
  ).innerHTML = html;

  const modal =
    document.getElementById(
      "modal"
    );

  modal.classList.remove("hidden");

  requestAnimationFrame(()=>{

    const firstInteractive =
      modal.querySelector(
        "input,select,textarea,button"
      );

    (firstInteractive || modal).focus();

  });
}


function closeModal(){

  document.getElementById(
    "modal"
  ).classList.add("hidden");

  const previous =
    state.lastFocusedElement;

  state.lastFocusedElement = null;

  if(previous?.isConnected){
    previous.focus();
  }
}


document
  .getElementById("modal")
  .addEventListener("click",e=>{

    if(e.target.id === "modal"){
      closeModal();
    }

  });


document.addEventListener("keydown",e=>{

  if(
    e.key === "Escape" &&
    !document
      .getElementById("modal")
      .classList.contains("hidden")
  ){
    closeModal();
  }

});


function formatDate(value){

  if(!value){
    return "-";
  }

  return new Date(value)
    .toLocaleDateString(
      "en-PH",
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );
}


function formatTime(value){

  if(!value){
    return "-";
  }

  return new Date(value)
    .toLocaleTimeString(
      "en-PH",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}


function localDateString(value){

  const date =
    value instanceof Date
      ? value
      : new Date(value);

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


function statusBadge(status){

  const s =
    String(status || "").toLowerCase();

  if(s === "present"){
    return `
      <span class="badge badge-present">
        Present
      </span>
    `;
  }

  if(s === "late"){
    return `
      <span class="badge badge-late">
        Late
      </span>
    `;
  }

  if(s === "absent"){
    return `
      <span class="badge badge-absent">
        Absent
      </span>
    `;
  }

  if(
    s === "time out" ||
    s === "timeout"
  ){

    return `
      <span class="badge badge-timeout">
        Time Out
      </span>
    `;
  }

  return `
    <span class="badge badge-inactive">
      ${escapeHTML(status || "-")}
    </span>
  `;
}


function getInitials(name){

  if(!name){
    return "GA";
  }

  return name
    .split(" ")
    .slice(0,2)
    .map(
      x=>x.charAt(0).toUpperCase()
    )
    .join("");
}


function studentPhoto(student){

  if(student?.photo_path){

    if(
      student.photo_path.startsWith("http")
    ){
      return student.photo_path;
    }

    const {
      data
    } =
      db.storage
        .from("student-photos")
        .getPublicUrl(
          student.photo_path
        );

    if(data?.publicUrl){
      return data.publicUrl;
    }
  }

  return "";
}


function photoHTML(student){

  const url =
    studentPhoto(student);

  if(url){

    return `
      <img
        src="${escapeHTML(url)}"
        class="profile-photo"
        alt="Student Photo"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
      >

      <div
        style="
          display:none;
          width:90px;
          height:90px;
          border-radius:50%;
          background:var(--maroon);
          color:white;
          align-items:center;
          justify-content:center;
          font-size:25px;
          font-weight:800;
        "
      >
        ${escapeHTML(
          getInitials(student.full_name)
        )}
      </div>
    `;
  }

  return `
    <div
      style="
        width:90px;
        height:90px;
        border-radius:50%;
        background:var(--maroon);
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:25px;
        font-weight:800;
      "
    >
      ${escapeHTML(
        getInitials(student.full_name)
      )}
    </div>
  `;
}


/* =========================================================
   EDGE FUNCTION
========================================================= */

async function callFunction(
  action,
  payload={}
){

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();

  if(!session){
    throw new Error(
      "Not authenticated"
    );
  }

  const response =
    await fetch(
      EDGE_FUNCTION_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json",
          "Authorization":
            "Bearer " +
            session.access_token
        },
        body:JSON.stringify({
          action,
          ...payload
        })
      }
    );

  const result =
    await response.json();

  if(!response.ok){

    throw new Error(
      result.error ||
      result.message ||
      "Edge Function error"
    );
  }

  return result;
}


/* =========================================================
   AUTH
========================================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async e=>{

      e.preventDefault();

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      try{

        const {
          data,
          error
        } =
          await db.auth.signInWithPassword({
            email,
            password
          });

        if(error){
          throw error;
        }

        state.user =
          data.user;

        await loadUser();

        showApp();

      }catch(error){

        console.error(error);

        showToast(
          error.message ||
          "Login failed",
          "error"
        );
      }
    }
  );


async function loadUser(){

  if(!state.user){
    return;
  }

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq("id",state.user.id)
      .maybeSingle();

  if(error){
    throw error;
  }

  state.profile =
    data;

  if(!state.profile){

    throw new Error(
      "No profile found for this account."
    );
  }

  document.getElementById(
    "sidebarUserName"
  ).textContent =
    state.profile.name ||
    state.user.email;

  document.getElementById(
    "sidebarUserRole"
  ).textContent =
    state.profile.role;

  document.getElementById(
    "topUser"
  ).textContent =
    state.profile.name ||
    state.user.email;

  buildNavigation();
}


async function checkSession(){

  const {
    data
  } =
    await db.auth.getSession();

  if(data.session){

    state.user =
      data.session.user;

    try{

      await loadUser();

      showApp();

    }catch(error){

      console.error(error);

      await db.auth.signOut();
    }
  }
}


db.auth.onAuthStateChange(
  async(event,session)=>{

    if(
      event === "SIGNED_OUT"
    ){

      state.user = null;
      state.profile = null;

      showLogin();
    }

  }
);

function updateActiveNavigation(page=state.currentPage){

  document
    .querySelectorAll(
      "#navigation button[onclick]"
    )
    .forEach(button=>{

      const match =
        button
          .getAttribute("onclick")
          ?.match(/loadPage\('([^']+)'\)/);

      const isActive =
        match?.[1] === page;

      button
        .classList
        .toggle("active",isActive);

      if(isActive){
        button.setAttribute(
          "aria-current",
          "page"
        );
      }else{
        button.removeAttribute(
          "aria-current"
        );
      }

    });
}


function updateTopbarDate(){

  const element =
    document.getElementById(
      "topbarDate"
    );

  if(!element){
    return;
  }

  element.textContent =
    new Intl.DateTimeFormat(
      "en-PH",
      {
        weekday:"short",
        month:"short",
        day:"numeric",
        year:"numeric"
      }
    ).format(new Date());
}


/* =========================================================
   PAGE LOADER
========================================================= */

async function loadPage(page){

  state.currentPage =
    page;

  document
    .getElementById("sidebar")
    .classList.remove("open");

  document
    .getElementById("mobileMenuBtn")
    .setAttribute("aria-expanded","false");

  updateActiveNavigation(page);
  updateTopbarDate();

  const titleMap = {

    dashboard:"Dashboard",
    students:"Student Records",
    teachers:"Teacher Accounts",
    subjects:"Subject Management",
    rooms:"RFID Rooms",
    assignments:"Teacher Assignments",
    attendance:"Attendance Monitoring",
    corrections:"Correction Requests",
    reports:"Reports",
    logs:"Activity Log",
    grades:
      state.profile?.role === "teacher"
        ? "Gradebook"
        : state.profile?.role === "student"
          ? "My Grades"
          : "Student Grades",
    mySubjects:"My Subjects",
    teacherAttendance:"Class Attendance",
    teacherStudents:"Students",
    profile:"My Profile",
    studentAttendance:"My Attendance"

  };

  document.getElementById(
    "pageTitle"
  ).textContent =
    titleMap[page] ||
    "Dashboard";

  try{

    switch(page){

      case "dashboard":
        await renderDashboard();
        break;

      case "students":
        await renderStudents();
        break;

      case "teachers":
        await renderTeachers();
        break;

      case "subjects":
        await renderSubjects();
        break;

      case "rooms":
        await renderRooms();
        break;

      case "assignments":
        await renderAssignments();
        break;

      case "attendance":
        await renderAttendance();
        break;

      case "corrections":
        await renderCorrectionRequests();
        break;

      case "reports":
        await renderReports();
        break;

      case "logs":
        await renderLogs();
        break;

      case "grades":
        await renderGrades();
        break;

      case "mySubjects":
        await renderMySubjects();
        break;

      case "teacherAttendance":
        await renderTeacherAttendance();
        break;

      case "teacherStudents":
        await renderTeacherStudents();
        break;

      case "profile":
        await renderStudentProfile();
        break;

      case "studentAttendance":
        await renderStudentAttendance();
        break;

      default:
        await renderDashboard();
    }

  }catch(error){

    console.error(error);

    document.getElementById(
      "content"
    ).innerHTML = `

      <div class="card">

        <h3>
          Unable to load this page
        </h3>

        <p
          style="
            color:var(--red);
            margin-top:10px
          "
        >
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>
    `;
  }
}

function filterStudents(){

  const q =
    document
      .getElementById(
        "studentSearch"
      )
      .value
      .toLowerCase();

  const filtered =
    state.students.filter(
      student => {

        return [
          student.student_id_number,
          student.full_name,
          student.course_section,
          student.rfid_uid
        ]
        .join(" ")
        .toLowerCase()
        .includes(q);

      }
    );

  document.getElementById(
    "studentTable"
  ).innerHTML =
    studentTableHTML(
      filtered
    );
}

async function createStudent(e){

  e.preventDefault();

  try{

    const studentIdNumber =
      document
        .getElementById(
          "studentIdNumber"
        )
        .value
        .trim();

    const fullName =
      document
        .getElementById(
          "studentFullName"
        )
        .value
        .trim();

    const courseSection =
      document
        .getElementById(
          "studentSection"
        )
        .value
        .trim();

    const rfidUid =
      document
        .getElementById(
          "studentRFID"
        )
        .value
        .trim();

    const email =
      document
        .getElementById(
          "studentEmail"
        )
        .value
        .trim();

    const password =
      document
        .getElementById(
          "studentPassword"
        )
        .value;

    let photoPath =
      null;


    const file =
      document
        .getElementById(
          "studentPhoto"
        )
        .files[0];


    if(file){

      if(
        file.size >
        3 * 1024 * 1024
      ){

        throw new Error(
          "Student photo must be 3 MB or smaller."
        );
      }

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();

      const filename =
        crypto.randomUUID() +
        "." +
        extension;

      const upload =
        await db.storage
          .from("student-photos")
          .upload(
            filename,
            file,
            {
              upsert:false,
              contentType:file.type
            }
          );

      if(upload.error){
        throw upload.error;
      }

      photoPath =
        filename;
    }


    let authUserId =
      null;


    if(email && password){

      const result =
        await callFunction(
          "add_student",
          {
            email,
            password,
            name:fullName
          }
        );

      authUserId =
        result.user?.id ||
        result.id ||
        result.user_id ||
        null;
    }


    const {
      error
    } =
      await db
        .from("students")
        .insert({
          student_id_number:
            studentIdNumber,

          full_name:
            fullName,

          rfid_uid:
            rfidUid,

          course_section:
            courseSection,

          auth_user_id:
            authUserId,

          photo_path:
            photoPath
        });

    if(error){
      throw error;
    }


    await logActivity(
      "ADD_STUDENT",
      "Added student " +
      fullName
    );


    closeModal();

    showToast(
      "Student added successfully.",
      "success"
    );

    await renderStudents();

  }catch(error){

    console.error(error);

    showToast(
      error.message,
      "error"
    );
  }
}

async function deleteStudentLogin(id){

    state.students.find(

        x.id === id
    );

  if(!student?.auth_user_id){
    return;
  }

  const confirmed =
    confirm(
      "Delete this student's login account?\n\n" +
      "The student record, RFID UID and attendance history will remain."
    );

  if(!confirmed){
    return;
  }

  try{

    await callFunction(
      "delete_student_login",
      {
        user_id:
          student.auth_user_id
      }
    );


    const {
      error
    } =
      await db
        .from("students")
        .update({
          auth_user_id:null
        })
        .eq(
          "id",

      </p>

  }


  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Date</th>

            <th>Student ID</th>
            <th>Subject</th>
            <th>Time</th>
            <th>Status</th>
            <th>Reader</th>
          </tr>

        </thead>

        <tbody>

          ${
            records.map(
              row => `

                <tr>

                  <td>
                    ${formatDate(
                      row.timestamp
                    )}
                  </td>

                  <td>
                    ${escapeHTML(
                      row.students?.full_name ||
                      "-"
                    )}
                  </td>

                  <td>
                    ${escapeHTML(
                      row.students?.student_id_number ||
                      "-"

function filterAttendance(){

  const search =
    document
      .getElementById(
        "attendanceSearch"
      )
      .value
      .toLowerCase();

  const status =
    document
      .getElementById(
        "attendanceStatus"
      )
      .value;

  const date =
    document
      .getElementById(
        "attendanceDate"
      )
      .value;


  const filtered =
    state.attendance.filter(
      row => {

        const studentName =
          row.students?.full_name ||
          "";

        const studentId =
          row.students?.student_id_number ||
          "";

        const matchesSearch =
          (
            studentName +
            " " +
            studentId
          )
          .toLowerCase()
          .includes(search);

        const matchesStatus =
          !status ||
          row.status === status;

        const matchesDate =
          !date ||
          localDateString(
            row.timestamp
          ) === date;

        return (
          matchesSearch &&
          matchesStatus &&
          matchesDate
        );
      }
    );


  document.getElementById(
    "attendanceTable"
  ).innerHTML =
    attendanceTableHTML(
      filtered
    );
}

async function startSession(){

  const teacher =
    state.teachers.find(
      t =>
        t.auth_user_id ===
        state.user.id
    );

  if(!teacher){

    showToast(
      "Teacher profile not found.",
      "error"
    );

    return;
  }


  const assignments =
    await loadTeacherAssignments();


  const subjectId =
    document
      .getElementById(
        "sessionSubject"
      )
      .value;

  const section =
    document
      .getElementById(
        "sessionSection"
      )
      .value
      .trim();

  const roomId =
    document
      .getElementById(
        "sessionRoom"
      )
      .value;


  if(
    !subjectId ||
    !roomId
  ){

    showToast(
      "Select a subject and RFID room.",
      "error"
    );

    return;
  }


  const assignment =
    assignments.find(
      a =>
        a.subject_id ===
        subjectId &&
        a.room_id ===
        roomId
    );


  if(!assignment){

    showToast(
      "This subject and RFID room are not assigned to you.",
      "error"
    );

    return;
  }


  const room =
    state.rooms.find(
      r =>
        r.id === roomId
    );


  if(!room){

    showToast(
      "RFID room not found.",
      "error"
    );

    return;
  }


  try{

    const {
      data,
      error
    } =
      await db
        .from("attendance_sessions")
        .insert({

          teacher_id:
            teacher.id,

          subject_id:
            subjectId,

          room_id:
            roomId,

          reader_id:
            room.reader_id,

          course_section:
            section,

          start_time:
            new Date().toISOString(),

          status:
            "active"

        })
        .select()
        .single();


    if(error){
      throw error;
    }


    state.currentSession =
      data;


    const scannerStatus =
      document.getElementById(
        "scannerStatus"
      );

    if(scannerStatus){

      scannerStatus.textContent =
        "Session Active - Waiting for RFID Scans";
    }


    showToast(
      "Class session started.",
      "success"
    );

  }catch(error){

    showToast(
      error.message,
      "error"
    );
  }
}

function formatGrade(value){

  const grade =
    Number(value);

  if(!Number.isFinite(grade)){
    return "-";
  }

  return grade
    .toFixed(2)
    .replace(/\.00$/," ")
    .trim();
}


function gradeChipHTML(value){

  const grade =
    Number(value);

  const level =
    grade >= 75
      ? "grade-passing"
      : "grade-review";

  return `
    <span class="grade-chip ${level}">
      ${formatGrade(grade)}
    </span>
  `;
}


function gradeRecordsTableHTML(records,showStudent=false){

  return `

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            ${
              showStudent

                <th>Student ID</th>

function openGradeModal(studentId,subjectId){

  const student =
    state.students.find(
      item=>item.id === studentId
    );

  const subject =
    state.subjects.find(
      item=>item.id === subjectId
    );

  const existingGrade =
    state.grades.find(
      record =>
        record.student_id === studentId &&
        record.subject_id === subjectId
    );

  if(!student || !subject){
    showToast(
      "Unable to open this grade record.",
      "error"
    );
    return;
  }

  openModal(`

    <div class="modal-header">
      <div>
        <div class="modal-title">
          ${existingGrade ? "Edit Grade" : "Record Grade"}
        </div>
        <div class="modal-subtitle">
          ${escapeHTML(student.full_name)} · ${escapeHTML(subject.subject_code)}
        </div>
      </div>
      <button
        class="close-btn"
        type="button"
        onclick="closeModal()"
        aria-label="Close dialog"
      >
        ×
      </button>
    </div>

    <form id="gradeForm">
      <div class="form-group">
        <label for="gradeValue">Final Grade</label>
        <input
          id="gradeValue"
          type="number"
          min="0"
          max="100"
          step="0.01"
          value="${
            existingGrade
            ? escapeHTML(existingGrade.grade)
            : ""
          }"
          placeholder="0–100"
          required
        >
      </div>

      <div class="form-group">
        <label for="gradeRemarks">Remarks <span class="form-hint">optional</span></label>
        <textarea
          id="gradeRemarks"
          rows="3"
          maxlength="500"
          placeholder="e.g. Completed all requirements"
        >${escapeHTML(existingGrade?.remarks || "")}</textarea>
      </div>

      <div class="modal-actions">
        <button
          type="button"
          class="secondary-btn"
          onclick="closeModal()"
        >
          Cancel
        </button>
        <button class="primary-btn">
          ${existingGrade ? "Save Changes" : "Save Grade"}
        </button>
      </div>
    </form>
  `);

  document
    .getElementById("gradeForm")
    .addEventListener(
      "submit",
      async event=>{

        event.preventDefault();

        try{

          const grade =
            Number(
              document
                .getElementById("gradeValue")
                .value
            );

          if(
            !Number.isFinite(grade) ||
            grade < 0 ||
            grade > 100
          ){
            throw new Error(
              "Enter a grade from 0 to 100."
            );
          }

          const teacher =
            state.teachers.find(
              item =>
                item.auth_user_id ===
                state.user.id
            );

          if(!teacher){
            throw new Error(
              "Teacher profile not found."
            );
          }

          const values = {
            student_id:studentId,
            subject_id:subjectId,
            graded_by:teacher.id,
            grade,
            remarks:
              document
                .getElementById("gradeRemarks")
                .value
                .trim() || null,
            updated_at:
              new Date().toISOString()
          };

          const result =
            existingGrade
            ? await db
                .from("student_grades")
                .update(values)
                .eq("id",existingGrade.id)
            : await db
                .from("student_grades")
                .insert(values);

          if(result.error){
            throw result.error;
          }

          await loadGrades();
          closeModal();
          await renderTeacherGrades();

          showToast(
            existingGrade
              ? "Grade updated."
              : "Grade saved.",
            "success"
          );

        }catch(error){
          showToast(
            error.message ||
            "Unable to save this grade.",
            "error"
          );
        }

      }
    );
}

function correctionStatusBadge(status){

  const value =
    String(status || "pending").toLowerCase();

  const className =
    value === "approved"
      ? "badge-present"
      : value === "rejected"
        ? "badge-absent"
        : "badge-late";

  return `
    <span class="badge ${className}">
      ${escapeHTML(value)}
    </span>
  `;
}


function openCorrectionRequestModal(){

  const records =
    window.studentRecords || [];

  if(!records.length){
    showToast("No attendance record is available to correct.","warning");
    return;
  }

  openModal(`
    <div class="modal-header">
      <div>
        <div class="modal-title">Request Attendance Correction</div>
        <div class="modal-subtitle">Your teacher or an administrator will review this request.</div>
      </div>
      <button class="close-btn" type="button" onclick="closeModal()" aria-label="Close dialog">×</button>
    </div>

    <form id="correctionRequestForm">
      <div class="form-group">
        <label for="correctionRecord">Attendance record</label>
        <select id="correctionRecord" required>
          ${records.map(row=>`
            <option value="${escapeHTML(row.id)}">
              ${escapeHTML(formatDate(row.timestamp))} — ${escapeHTML(row.subjects?.subject_code || "Attendance")} — ${escapeHTML(row.status)}
            </option>
          `).join("")}
        </select>
      </div>

      <div class="form-group">
        <label for="correctionStatus">Requested status</label>
        <select id="correctionStatus" required>
          <option value="Present">Present</option>
          <option value="Late">Late</option>
          <option value="Absent">Absent</option>
          <option value="Time Out">Time Out</option>
        </select>
      </div>

      <div class="form-group">
        <label for="correctionReason">Reason</label>
        <textarea id="correctionReason" rows="4" minlength="10" maxlength="500" placeholder="Explain what needs to be corrected." required></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="secondary-btn" onclick="closeModal()">Cancel</button>
        <button class="primary-btn">Submit Request</button>
      </div>
    </form>
  `);

  document
    .getElementById("correctionRequestForm")
    .addEventListener("submit",async event=>{

      event.preventDefault();

      try{
        const student = await getCurrentStudent();
        const attendanceRecordId = document.getElementById("correctionRecord").value;
        const reason = document.getElementById("correctionReason").value.trim();

        if(reason.length < 10){
          throw new Error("Please provide at least 10 characters explaining the request.");
        }

        const {error} = await db
          .from("attendance_correction_requests")
          .insert({
            attendance_record_id:attendanceRecordId,
            student_id:student.id,
            requester_user_id:state.user.id,
            requested_status:document.getElementById("correctionStatus").value,
            reason
          });

        if(error){
          throw error;
        }

        closeModal();
        showToast("Correction request submitted.","success");
      }catch(error){
        showToast(error.message || "Unable to submit request.","error");
      }
    });
}


function filterStudentAttendance(){

  const date =
    document
      .getElementById(
        "studentAttendanceDate"
      )
      .value;

  const status =
    document
      .getElementById(
        "studentAttendanceStatus"
      )
      .value;


  const records =
    (
      window.studentRecords ||
      []
    ).filter(
      row => {

        return (

          (
            !date ||
            localDateString(
              row.timestamp
            ) === date
          )

          &&

          (
            !status ||
            row.status ===
            status
          )

        );
      }
    );


  document.getElementById(
    "studentAttendanceTable"
  ).innerHTML =
    attendanceTableHTML(
      records
    );
}

async function renderCorrectionRequests(){

  await Promise.all([
    loadCorrectionRequests(),
    loadTeachers()
  ]);

  let requests =
    state.correctionRequests;

  if(state.profile.role === "teacher"){

    const teacher =
      state.teachers.find(
        item => item.auth_user_id === state.user.id
      );

    requests = requests.filter(
      request =>
        request.attendance_records?.teacher_id === teacher?.id
    );
  }

  const pending =
    requests.filter(
      request => request.status === "pending"
    ).length;

  document.getElementById("content").innerHTML = `
    <div class="stats-grid correction-stats">
      <div class="stat-card">
        <div class="stat-label">Pending review</div>
        <div class="stat-value">${pending}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Resolved</div>
        <div class="stat-value">${requests.length - pending}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">All requests</div>
        <div class="stat-value">${requests.length}</div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <div>
          <div class="card-title" style="margin-bottom:4px">Attendance Correction Requests</div>
          <p class="helper-text">Review requests before changing the original attendance record.</p>
        </div>
        <select id="correctionFilter" onchange="filterCorrectionRequests()" aria-label="Filter requests by status">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div id="correctionRequestTable">
        ${correctionRequestsTableHTML(requests)}
      </div>
    </div>
  `;

  window.visibleCorrectionRequests = requests;
}


function correctionRequestsTableHTML(requests){

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Attendance record</th>
            <th>Requested change</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Requested</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${
            requests.length
            ? requests.map(request=>`
              <tr>
                <td>
                  <strong>${escapeHTML(request.students?.full_name || "-")}</strong>
                  <div class="table-subtext">${escapeHTML(request.students?.student_id_number || "-")}</div>
                </td>
                <td>
                  ${formatDate(request.attendance_records?.timestamp)}
                  <div class="table-subtext">
                    ${escapeHTML(request.attendance_records?.subjects?.subject_code || "Attendance")} · ${escapeHTML(request.attendance_records?.status || "-")}
                  </div>
                </td>
                <td>${statusBadge(request.requested_status)}</td>
                <td class="request-reason">${escapeHTML(request.reason)}</td>
                <td>${correctionStatusBadge(request.status)}</td>
                <td>${formatDate(request.created_at)}</td>
                <td>
                  ${
                    request.status === "pending"
                    ? `<button class="secondary-btn small-btn" onclick="openCorrectionReviewModal('${request.id}')">Review</button>`
                    : `<span class="table-subtext">${escapeHTML(request.review_note || "Reviewed")}</span>`
                  }
                </td>
              </tr>
            `).join("")
            : `<tr><td colspan="7">No correction requests found.</td></tr>`
          }
        </tbody>
      </table>
    </div>
  `;
}


function filterCorrectionRequests(){

  const filter =
    document.getElementById("correctionFilter").value;

  const requests =
    (window.visibleCorrectionRequests || []).filter(
      request => !filter || request.status === filter
    );

  document.getElementById("correctionRequestTable").innerHTML =
    correctionRequestsTableHTML(requests);
}


function openCorrectionReviewModal(requestId){

  const request =
    state.correctionRequests.find(
      item => item.id === requestId
    );

  if(!request){
    showToast("Correction request not found.","error");
    return;
  }

  openModal(`
    <div class="modal-header">
      <div>
        <div class="modal-title">Review Correction Request</div>
        <div class="modal-subtitle">${escapeHTML(request.students?.full_name || "Student")} · ${formatDate(request.attendance_records?.timestamp)}</div>
      </div>
      <button class="close-btn" type="button" onclick="closeModal()" aria-label="Close dialog">×</button>
    </div>
    <div class="review-summary">
      <div><span>Recorded</span>${statusBadge(request.attendance_records?.status)}</div>
      <div><span>Requested</span>${statusBadge(request.requested_status)}</div>
      <p>${escapeHTML(request.reason)}</p>
    </div>
    <form id="correctionReviewForm">
      <div class="form-group">
        <label for="correctionDecision">Decision</label>
        <select id="correctionDecision" required>
          <option value="approved">Approve request</option>
          <option value="rejected">Reject request</option>
        </select>
      </div>
      <div class="form-group">
        <label for="correctionReviewNote">Review note <span class="form-hint">optional</span></label>
        <textarea id="correctionReviewNote" rows="3" maxlength="500" placeholder="Add context for the student."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary-btn" onclick="closeModal()">Cancel</button>
        <button class="primary-btn">Save Decision</button>
      </div>
    </form>
  `);

  document.getElementById("correctionReviewForm")
    .addEventListener("submit",async event=>{
      event.preventDefault();

      try{
        const decision = document.getElementById("correctionDecision").value;
        const reviewNote = document.getElementById("correctionReviewNote").value.trim() || null;
        const reviewValues = {
          status:decision,
          reviewer_user_id:state.user.id,
          review_note:reviewNote,
          reviewed_at:new Date().toISOString()
        };

        const {error:requestError} = await db
          .from("attendance_correction_requests")
          .update(reviewValues)
          .eq("id",request.id);

        if(requestError){
          throw requestError;
        }

        if(decision === "approved"){
          const {error:attendanceError} = await db
            .from("attendance_records")
            .update({status:request.requested_status})
            .eq("id",request.attendance_record_id);

          if(attendanceError){
            throw attendanceError;
          }
        }

        closeModal();
        await renderCorrectionRequests();
        showToast(
          decision === "approved"
            ? "Request approved and attendance updated."
            : "Request rejected.",
          "success"
        );
      }catch(error){
        showToast(error.message || "Unable to review this request.","error");
      }
    });
}

        <input
          id="reportStudent"
          type="search"
          placeholder="Search student"
          aria-label="Search report by student"
        >

          class="primary-btn"
          onclick="generateReport()"
        >
          Generate Report
        </button>

      </div>


      <div id="reportResult">

          style="color:var(--muted)"
        >
          Choose filters and generate a report. You can export the matching records afterwards.
        </p>

      </div>

function generateReport(){

  const from =
    document
      .getElementById(
        "reportFrom"
      )
      .value;

  const to =
    document
      .getElementById(
        "reportTo"
      )
      .value;

  const subjectId =
    document.getElementById("reportSubject").value;

  const status =
    document.getElementById("reportStatus").value;

  const studentQuery =
    document.getElementById("reportStudent").value.trim().toLowerCase();


  let records =
    state.attendance.filter(
      row => {

        const date =
          localDateString(
            row.timestamp
          );

        return (
          (!from ||
            date >= from) &&

          (!to ||
            date <= to) &&

          (!subjectId ||
            row.subject_id === subjectId ||
            row.subjects?.id === subjectId) &&

          (!status ||
            row.status === status) &&

          (!studentQuery ||
            `${row.students?.full_name || ""} ${row.students?.student_id_number || ""}`
              .toLowerCase()
              .includes(studentQuery))
        );
      }
    );


  if(
    state.profile.role ===
    "teacher"
  ){

    const teacher =
      state.teachers.find(
        t =>
          t.auth_user_id ===
          state.user.id
      );

    if(teacher){

      records =
        records.filter(
          row =>
            row.teacher_id ===
            teacher.id
        );
    }
  }


  const onTime = records.filter(row=>row.status === "Present").length;
  const late = records.filter(row=>row.status === "Late").length;
  const uniqueStudents = new Set(
    records.map(row=>row.student_id)
  ).size;

  document.getElementById(
    "reportResult"
  ).innerHTML = `

    <div class="stats-grid correction-stats">
      <div class="stat-card">
        <div class="stat-label">Matching records</div>
        <div class="stat-value">${records.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Present on time</div>
        <div class="stat-value">${onTime}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Late arrivals</div>
        <div class="stat-value">${late}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Students included</div>
        <div class="stat-value">${uniqueStudents}</div>
      </div>
    </div>

    <div class="toolbar">

      <button
        class="gold-btn"
        onclick="exportAttendanceExcel(window.currentReport)"
      >
        Export Excel
      </button>

      <button
        class="secondary-btn"
        onclick="exportAttendancePDF(window.currentReport)"
      >
        Export PDF
      </button>

    </div>


    ${attendanceTableHTML(
      records
    )}

  `;


  window.currentReport =
    records;
}

            >

          </div>


          <div class="form-group">

            <label>
              Attendance End
            </label>

            <input
              id="attendanceEnd"
              type="time"
              value="${escapeHTML(
                settings.attendance_end ||
                "05:59"
              )}"
            >

          </div>

        </div>


        <button
          class="primary-btn"
        >
          Save Settings
        </button>

      </form>

    </div>
  `;


  document
    .getElementById(
      "settingsForm"
    )
    .addEventListener(
      "submit",
      async e=>{

        e.preventDefault();

        try{

          const values = {

            school_name:
              document
                .getElementById(
                  "schoolName"
                )
                .value
                .trim(),

            school_year:
              document
                .getElementById(
                  "schoolYear"
                )
                .value
                .trim(),

            semester:
              document
                .getElementById(
                  "schoolSemester"
                )
                .value,

            attendance_start:
              document
                .getElementById(
                  "attendanceStart"
                )
                .value,

            late_time:
              document
                .getElementById(
                  "lateTime"
                )
                .value,

            attendance_end:
              document
                .getElementById(
                  "attendanceEnd"
                )
                .value,

            updated_at:
              new Date().toISOString()

          };


          let result;


          if(settings.id){

            result =
              await db
                .from(
                  "school_settings"
                )
                .update(values)
                .eq(
                  "id",
                  settings.id
                );

          }else{

            result =
              await db
                .from(
                  "school_settings"
                )
                .insert(values);
          }


          if(result.error){
            throw result.error;
          }


          showToast(
            "Settings saved.",
            "success"
          );

        }catch(error){

          showToast(
            error.message,
            "error"
          );
        }
      }
    );
}


/* =========================================================
   EXPORT EXCEL
========================================================= */

function exportAttendanceExcel(records){

  if(
    !records ||
    !records.length
  ){

    showToast(
      "No attendance data to export.",
      "warning"
    );

    return;
  }


  const rows =
    records.map(
      row => ({

        Date:
          formatDate(
            row.timestamp
          ),

        Time:
          formatTime(
            row.timestamp
          ),

        "Student ID":
          row.students?.student_id_number ||
          "",

        Student:
          row.students?.full_name ||
          "",

        "Course / Section":
          row.students?.course_section ||
          "",

        Subject:
          row.subjects?.subject_code ||
          "",

        "Subject Name":
          row.subjects?.subject_name ||
          "",

        Status:
          row.status ||
          "",

        "RFID UID":
          row.scanned_rfid ||
          "",

        "Reader ID":
          row.reader_id ||
          ""

      })
    );


  const worksheet =
    XLSX.utils.json_to_sheet(
      rows
    );

  const workbook =
    XLSX.utils.book_new();


  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "Attendance"
  );


  XLSX.writeFile(
    workbook,
    "Global_Academy_Attendance.xlsx"
  );


  showToast(
    "Excel file exported.",
    "success"
  );
}


/* =========================================================
   EXPORT PDF
========================================================= */

function exportAttendancePDF(records){

  if(
    !records ||
    !records.length
  ){

    showToast(
      "No attendance data to export.",
      "warning"
    );

    return;
  }


  const {
    jsPDF
  } = window.jspdf;


  const doc =
    new jsPDF();


  doc.setFontSize(16);

  doc.text(
    "Global Academy Smart Attendance",
    14,
    18
  );


  doc.setFontSize(10);

  doc.text(
    "Attendance Report",
    14,
    25
  );


  const rows =
    records.map(
      row => [

        formatDate(
          row.timestamp
        ),

        formatTime(
          row.timestamp
        ),

        row.students?.student_id_number ||
        "",

        row.students?.full_name ||
        "",

        row.subjects?.subject_code ||
        "",

        row.status ||
        "",

        row.reader_id ||
        ""

      ]
    );


  doc.autoTable({

    startY:32,

    head:[[

      "Date",
      "Time",
      "Student ID",
      "Student",
      "Subject",
      "Status",
      "Reader"

    ]],

    body:rows,

    styles:{
      fontSize:8
    }

  });


  doc.save(
    "Global_Academy_Attendance.pdf"
  );


  showToast(
    "PDF exported.",
    "success"
  );
}


/* =========================================================
   REAL-TIME ATTENDANCE
========================================================= */

function subscribeRealtime(){

  db
    .channel(
      "attendance-live"
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"attendance_records"
      },
      async payload=>{

        console.log(
          "Attendance update:",
          payload
        );


        try{

          await loadAttendance();


          if(
            state.currentPage ===
            "attendance"
          ){

            const element =
              document.getElementById(
                "attendanceTable"
              );

            if(element){

              element.innerHTML =
                attendanceTableHTML(
                  state.attendance
                );
            }

          }


          if(
            state.currentPage ===
            "teacherAttendance"
          ){

            const element =
              document.getElementById(
                "teacherAttendanceTable"
              );

            if(element){

              const teacher =
                state.teachers.find(
                  t =>
                    t.auth_user_id ===
                    state.user?.id
                );

              const records =
                teacher
                  ? state.attendance.filter(
                      row =>
                        row.teacher_id ===
                        teacher.id
                    )
                  : [];

              element.innerHTML =
                attendanceTableHTML(
                  records
                );
            }

          }

        }catch(error){

          console.error(
            error
          );
        }

      }
    )
    .subscribe();


  db
    .channel(
      "rooms-live"
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"rooms"
      },
      async()=>{

        try{

          await loadRooms();

        }catch(error){

          console.error(
            error
          );
        }

      }
    )
    .subscribe();
}

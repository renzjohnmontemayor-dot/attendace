<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Academy Smart Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
:root{
  --maroon:#74152b;
  --maroon-dark:#4d0d1c;
  --gold:#d9a441;
  --gold-light:#f4d78b;
  --bg:#f5f5f7;
  --card:#fff;
  --text:#242424;
  --muted:#737373;
  --border:#e5e5e5;
  --green:#198754;
  --red:#dc3545;
  --orange:#f0a202;
  --blue:#2563eb;
  --shadow:0 8px 25px rgba(0,0,0,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,var(--maroon-dark),var(--maroon));
}

.login-box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:18px;
  padding:35px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.login-logo{
  width:90px;
  height:90px;
  object-fit:cover;
  display:block;
  margin:0 auto 18px;
  border-radius:18px;
  border:3px solid var(--gold);
}

.login-title{
  text-align:center;
  color:var(--maroon);
  font-size:24px;
  font-weight:800;
}

.login-subtitle{
  text-align:center;
  color:var(--muted);
  margin:8px 0 28px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--maroon);
}

.primary-btn{
  border:0;
  background:var(--maroon);
  color:#fff;
  padding:12px 18px;
  border-radius:9px;
  font-weight:700;
}

.primary-btn:hover{
  background:var(--maroon-dark);
}

.gold-btn{
  border:0;
  background:var(--gold);
  color:#2b1c00;
  padding:12px 18px;
  border-radius:9px;
  font-weight:700;
}

.secondary-btn{
  border:1px solid var(--border);
  background:#fff;
  padding:10px 15px;
  border-radius:8px;
  font-weight:700;
}

.danger-btn{
  border:0;
  background:var(--red);
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-weight:700;
}

.success-btn{
  border:0;
  background:var(--green);
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-weight:700;
}

.small-btn{
  padding:7px 10px;
  font-size:12px;
}

/* APP */

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:260px;
  background:var(--maroon-dark);
  color:#fff;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
  z-index:100;
}

.brand{
  padding:20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.admin-brand-logo{
  width:42px;
  height:42px;
  border-radius:10px;
  object-fit:cover;
  border:2px solid var(--gold);
  background:#fff;
  flex-shrink:0;
}

.brand-title{
  font-weight:800;
  font-size:15px;
}

.brand-sub{
  font-size:11px;
  opacity:.7;
  margin-top:3px;
}

.user-box{
  padding:16px 20px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.user-name{
  font-weight:700;
}

.user-role{
  color:var(--gold-light);
  font-size:12px;
  margin-top:4px;
  text-transform:uppercase;
}

.nav{
  padding:12px;
}

.nav-section{
  color:#caaeb6;
  font-size:10px;
  text-transform:uppercase;
  padding:14px 10px 7px;
  font-weight:800;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  text-align:left;
  padding:11px 12px;
  border-radius:8px;
  margin-bottom:3px;
  font-weight:600;
}

.nav button:hover,
.nav button.active{
  background:rgba(255,255,255,.12);
}

.logout{
  margin:15px 12px;
  width:calc(100% - 24px);
  padding:11px;
  border:1px solid rgba(255,255,255,.25);
  color:white;
  background:transparent;
  border-radius:8px;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
}

.page-title{
  font-size:21px;
  font-weight:800;
}

.content{
  padding:25px;
}

/* CARDS */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:20px;
}

.stat-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.stat-value{
  font-size:30px;
  font-weight:800;
  margin-top:8px;
  color:var(--maroon);
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  box-shadow:var(--shadow);
  padding:20px;
}

.card-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:16px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.toolbar input,
.toolbar select{
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
}

/* TABLE */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
}

th{
  background:#fafafa;
  font-weight:800;
}

tr:hover td{
  background:#fcfcfc;
}

/* BADGES */

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:30px;
  font-size:11px;
  font-weight:800;
}

.badge-present{
  background:#d9f4e4;
  color:#126b38;
}

.badge-late{
  background:#fff0c7;
  color:#8b5a00;
}

.badge-absent{
  background:#ffe0e3;
  color:#a3192a;
}

.badge-timeout{
  background:#dce8ff;
  color:#174ba5;
}

.badge-active{
  background:#d9f4e4;
  color:#126b38;
}

.badge-inactive{
  background:#eee;
  color:#666;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:300;
}

.modal-box{
  background:white;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:15px;
  padding:24px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-title{
  font-size:20px;
  font-weight:800;
  color:var(--maroon);
}

.close-btn{
  border:0;
  background:#eee;
  width:34px;
  height:34px;
  border-radius:50%;
  font-size:20px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

/* PROFILE */

.profile-header{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:20px;
}

.profile-photo{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
  border:3px solid var(--gold);
}

.profile-name{
  font-size:25px;
  font-weight:800;
}

.profile-meta{
  color:var(--muted);
  margin-top:5px;
}

/* RFID */

.rfid-box{
  text-align:center;
  padding:30px;
  border:2px dashed var(--gold);
  border-radius:13px;
  background:#fffaf0;
}

.rfid-icon{
  font-size:45px;
  margin-bottom:12px;
}

.rfid-status{
  font-size:20px;
  font-weight:800;
  color:var(--maroon);
}

.recent-list{
  list-style:none;
}

.recent-list li{
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

/* TOAST */

.toast-container{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:500;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.toast{
  min-width:280px;
  max-width:380px;
  background:#222;
  color:#fff;
  padding:14px 17px;
  border-radius:9px;
  box-shadow:var(--shadow);
}

.toast.success{
  background:var(--green);
}

.toast.error{
  background:var(--red);
}

.toast.warning{
  background:var(--orange);
  color:#222;
}

/* MOBILE */

.mobile-menu{
  display:none;
  border:0;
  background:transparent;
  font-size:25px;
}

@media(max-width:1000px){
  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-3{
    grid-template-columns:1fr;
  }
}

@media(max-width:750px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .grid-2{
    grid-template-columns:1fr;
  }

  .stats-grid{
    grid-template-columns:1fr;
  }

  .content{
    padding:15px;
  }

  .topbar{
    padding:0 15px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <img
      src="global-academy-logo.jpg"
      class="login-logo"
      alt="Global Academy Logo"
    >

    <div class="login-title">
      Global Academy Smart Attendance
    </div>

    <div class="login-subtitle">
      Sign in to your account
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label>Email Address</label>
        <input
          id="loginEmail"
          type="email"
          required
          placeholder="Enter your email"
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          id="loginPassword"
          type="password"
          required
          placeholder="Enter your password"
        >
      </div>

      <button class="primary-btn" style="width:100%" type="submit">
        Sign In
      </button>

    </form>

  </div>

</div>


<!-- APP -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">

    <div class="brand">

      <img
        src="global-academy-logo.jpg"
        class="admin-brand-logo"
        alt="Global Academy Logo"
      >

      <div>
        <div class="brand-title">
          Global Academy
        </div>
        <div class="brand-sub">
          Smart Attendance
        </div>
      </div>

    </div>

    <div class="user-box">
      <div id="sidebarUserName" class="user-name">
        User
      </div>
      <div id="sidebarUserRole" class="user-role">
        Role
      </div>
    </div>

    <nav id="navigation" class="nav"></nav>

    <button id="logoutBtn" class="logout">
      Logout
    </button>

  </aside>


  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;gap:12px">

        <button
          id="mobileMenuBtn"
          class="mobile-menu"
        >
          ☰
        </button>

        <div id="pageTitle" class="page-title">
          Dashboard
        </div>

      </div>

      <div id="topUser">
        User
      </div>

    </header>

    <section id="content" class="content"></section>

  </main>

</div>


<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div id="modalBox" class="modal-box"></div>
</div>


<div id="toastContainer" class="toast-container"></div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://uyxyiktqgrpcdgccoigo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_HNeDdoOj0y2776d6XkNZlg_SuQ53-RG";

const EDGE_FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/clever-action";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

const state = {
  user:null,
  profile:null,
  students:[],
  teachers:[],
  subjects:[],
  rooms:[],
  attendance:[],
  assignments:[],
  logs:[],
  currentPage:"dashboard",
  selectedStudent:null,
  currentSession:null
};


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){
  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function showToast(message,type=""){
  const container =
    document.getElementById("toastContainer");

  const toast =
    document.createElement("div");

  toast.className =
    "toast " + type;

  toast.textContent =
    message;

  container.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },3500);
}


function openModal(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").classList.remove("hidden");
}


function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}


document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id === "modal"){
    closeModal();
  }
});


function formatDate(value){
  if(!value){
    return "-";
  }

  return new Date(value).toLocaleDateString(
    "en-PH",
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );
}


function formatTime(value){
  if(!value){
    return "-";
  }

  return new Date(value).toLocaleTimeString(
    "en-PH",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function statusBadge(status){

  const s =
    String(status || "").toLowerCase();

  if(s === "present"){
    return `<span class="badge badge-present">Present</span>`;
  }

  if(s === "late"){
    return `<span class="badge badge-late">Late</span>`;
  }

  if(s === "absent"){
    return `<span class="badge badge-absent">Absent</span>`;
  }

  if(
    s === "time out" ||
    s === "timeout"
  ){
    return `<span class="badge badge-timeout">Time Out</span>`;
  }

  return `<span class="badge badge-inactive">${escapeHTML(status || "-")}</span>`;
}


function getInitials(name){
  if(!name){
    return "GA";
  }

  return name
    .split(" ")
    .slice(0,2)
    .map(x=>x.charAt(0).toUpperCase())
    .join("");
}


function studentPhoto(student){

  if(student?.photo_path){

    if(
      student.photo_path.startsWith("http")
    ){
      return student.photo_path;
    }

    const {
      data
    } = db.storage
      .from("student-photos")
      .getPublicUrl(student.photo_path);

    if(data?.publicUrl){
      return data.publicUrl;
    }
  }

  return "";
}


function photoHTML(student){

  const url =
    studentPhoto(student);

  if(url){

    return `
      <img
        src="${escapeHTML(url)}"
        class="profile-photo"
        alt="Student Photo"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
      >
      <div
        style="
          display:none;
          width:90px;
          height:90px;
          border-radius:50%;
          background:var(--maroon);
          color:white;
          align-items:center;
          justify-content:center;
          font-size:25px;
          font-weight:800;
        "
      >
        ${escapeHTML(getInitials(student.full_name))}
      </div>
    `;
  }

  return `
    <div
      style="
        width:90px;
        height:90px;
        border-radius:50%;
        background:var(--maroon);
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:25px;
        font-weight:800;
      "
    >
      ${escapeHTML(getInitials(student.full_name))}
    </div>
  `;
}


/* =========================================================
   EDGE FUNCTION
========================================================= */

async function callFunction(action,payload={}){

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();

  if(!session){
    throw new Error("Not authenticated");
  }

  const response =
    await fetch(
      EDGE_FUNCTION_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":
            "Bearer " + session.access_token
        },
        body:JSON.stringify({
          action,
          ...payload
        })
      }
    );

  const result =
    await response.json();

  if(!response.ok){
    throw new Error(
      result.error ||
      result.message ||
      "Edge Function error"
    );
  }

  return result;
}


/* =========================================================
   AUTH
========================================================= */

document
  .getElementById("loginForm")
  .addEventListener("submit",async e=>{

    e.preventDefault();

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    try{

      const {
        data,
        error
      } =
        await db.auth.signInWithPassword({
          email,
          password
        });

      if(error){
        throw error;
      }

      state.user =
        data.user;

      await loadUser();

      showApp();

    }catch(error){

      console.error(error);

      showToast(
        error.message ||
        "Login failed",
        "error"
      );
    }
  });


async function loadUser(){

  if(!state.user){
    return;
  }

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq("id",state.user.id)
      .maybeSingle();

  if(error){
    throw error;
  }

  state.profile =
    data;

  if(!state.profile){

    throw new Error(
      "No profile found for this account."
    );
  }

  document.getElementById(
    "sidebarUserName"
  ).textContent =
    state.profile.name ||
    state.user.email;

  document.getElementById(
    "sidebarUserRole"
  ).textContent =
    state.profile.role;

  document.getElementById(
    "topUser"
  ).textContent =
    state.profile.name ||
    state.user.email;

  buildNavigation();
}


async function checkSession(){

  const {
    data
  } =
    await db.auth.getSession();

  if(data.session){

    state.user =
      data.session.user;

    try{

      await loadUser();

      showApp();

    }catch(error){

      console.error(error);

      await db.auth.signOut();

    }
  }
}


db.auth.onAuthStateChange(
  async(event,session)=>{

    if(
      event === "SIGNED_OUT"
    ){
      showLogin();
    }
  }
);


/* =========================================================
   SHOW / HIDE
========================================================= */

function showLogin(){

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");
}


function showApp(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  loadPage("dashboard");
}


/* =========================================================
   NAVIGATION
========================================================= */

function buildNavigation(){

  const nav =
    document.getElementById("navigation");

  const role =
    state.profile.role;

  let html = "";

  if(role === "admin"){

    html += `
      <div class="nav-section">Overview</div>

      <button onclick="loadPage('dashboard')">
        Dashboard
      </button>

      <div class="nav-section">Management</div>

      <button onclick="loadPage('students')">
        Student Records
      </button>

      <button onclick="loadPage('teachers')">
        Teacher Accounts
      </button>

/* =========================================================

========================================================= */

async function loadPage(page){

  state.currentPage =
    page;

  document
    .getElementById("sidebar")
    .classList.remove("open");

  const titleMap = {
    dashboard:"Dashboard",
    students:"Student Records",
    teachers:"Teacher Accounts",
    subjects:"Subject Management",
    rooms:"RFID Rooms",
    assignments:"Teacher Assignments",
    attendance:"Attendance Monitoring",
    reports:"Reports",
    logs:"Activity Log",
    settings:"System Settings",
    mySubjects:"My Subjects",
    teacherAttendance:"Class Attendance",
    teacherStudents:"Students",
    profile:"My Profile",
    studentAttendance:"My Attendance"
  };

  document.getElementById(
    "pageTitle"
  ).textContent =
    titleMap[page] || "Dashboard";

  try{

    switch(page){

      case "dashboard":
        await renderDashboard();
        break;

      case "students":
        await renderStudents();
        break;

      case "teachers":
        await renderTeachers();
        break;

      case "subjects":
        await renderSubjects();
        break;

      case "rooms":
        await renderRooms();
        break;

      case "assignments":
        await renderAssignments();
        break;

      case "attendance":
        await renderAttendance();
        break;

      case "reports":
        await renderReports();
        break;

      case "logs":
        await renderLogs();
        break;

      case "settings":
        await renderSettings();
        break;

      case "mySubjects":
        await renderMySubjects();
        break;

      case "teacherAttendance":
        await renderTeacherAttendance();
        break;

      case "teacherStudents":
        await renderTeacherStudents();
        break;

      case "profile":
        await renderStudentProfile();
        break;

      case "studentAttendance":
        await renderStudentAttendance();
        break;

      default:
        await renderDashboard();
    }

  }catch(error){

    console.error(error);

    document.getElementById(
      "content"
    ).innerHTML = `
      <div class="card">
        <h3>Unable to load this page</h3>
        <p style="color:var(--red);margin-top:10px">
          ${escapeHTML(error.message)}
        </p>
      </div>
    `;
  }
}

function filterStudents(){

    state.students.filter(student=>{

        student.full_name,
        student.course_section,

      ]
      .join(" ")
      .toLowerCase()
      .includes(q);

  document.getElementById(
    "studentTable"
  ).innerHTML =
    studentTableHTML(filtered);

async function createStudent(e){

  e.preventDefault();

  try{

    const studentIdNumber =
      document
        .getElementById("studentIdNumber")
        .value
        .trim();

    const fullName =
      document
        .getElementById("studentFullName")
        .value
        .trim();

    const courseSection =
      document
        .getElementById("studentSection")
        .value
        .trim();

    const rfidUid =
      document
        .getElementById("studentRFID")
        .value
        .trim();

    const email =
      document
        .getElementById("studentEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("studentPassword")
        .value;

    let photoPath =
      null;


    const file =
      document
        .getElementById("studentPhoto")
        .files[0];


    if(file){

      if(file.size > 3 * 1024 * 1024){
        throw new Error(
          "Student photo must be 3 MB or smaller."
        );
      }

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();

      const filename =
        crypto.randomUUID() +
        "." +
        extension;

      const upload =
        await db.storage
          .from("student-photos")
          .upload(
            filename,
            file,
            {
              upsert:false,
              contentType:file.type
            }
          );

      if(upload.error){
        throw upload.error;
      }

      photoPath =
        filename;
    }


    let authUserId =
      null;


    if(email && password){

      const result =
        await callFunction(
          "add_student",
          {
            email,
            password,
            name:fullName
          }
        );

      authUserId =
        result.user?.id ||
        result.id ||
        result.user_id ||
        null;

    }


    const {
      data,
      error
    } =
      await db
        .from("students")
        .insert({
          student_id_number:studentIdNumber,
          full_name:fullName,
          rfid_uid:rfidUid,
          course_section:courseSection,
          auth_user_id:authUserId,
          photo_path:photoPath
        })
        .select()
        .single();


    if(error){
      throw error;
    }


    await logActivity(
      "ADD_STUDENT",
      "Added student " + fullName
    );


    closeModal();

    showToast(
      "Student added successfully.",
      "success"
    );

    await renderStudents();

  }catch(error){

    console.error(error);

    showToast(
      error.message,
      "error"
    );
  }
}

function editStudent(id){

  const student =
    state.students.find(
      x=>x.id === id
    );

  if(!student){
    return;
  }


  openModal(`

    <div class="modal-header">

      <div class="modal-title">
        Edit Student
      </div>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <form id="editStudentForm">

      <div class="form-group">
        <label>Student ID Number</label>
        <input
          id="editStudentId"
          value="${escapeHTML(student.student_id_number)}"
          required
        >
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input
          id="editStudentName"
          value="${escapeHTML(student.full_name)}"
          required
        >
      </div>

      <div class="form-group">
        <label>Course and Section</label>
        <input
          id="editStudentSection"
          value="${escapeHTML(student.course_section)}"
          required
        >
      </div>

      <div class="form-group">
        <label>RFID UID</label>
        <input
          id="editStudentRFID"
          value="${escapeHTML(student.rfid_uid)}"
          required
        >
      </div>

      <div class="form-group">
        <label>Change Photo</label>
        <input
          id="editStudentPhoto"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >
      </div>

      <div class="modal-actions">

        <button
          type="button"
          class="secondary-btn"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          class="primary-btn"
          type="submit"
        >
          Save Changes
        </button>

      </div>

    </form>
  `);


  document
    .getElementById("editStudentForm")
    .addEventListener(
      "submit",
      async e=>{

        e.preventDefault();

        try{

          const updates = {
            student_id_number:
              document.getElementById(
                "editStudentId"
              ).value.trim(),

            full_name:
              document.getElementById(
                "editStudentName"
              ).value.trim(),

            course_section:
              document.getElementById(
                "editStudentSection"
              ).value.trim(),

            rfid_uid:
              document.getElementById(
                "editStudentRFID"
              ).value.trim()
          };


          const file =
            document
              .getElementById(
                "editStudentPhoto"
              )
              .files[0];


          if(file){

            if(file.size > 3 * 1024 * 1024){
              throw new Error(
                "Photo must be 3 MB or smaller."
              );
            }

            const extension =
              file.name
                .split(".")
                .pop()
                .toLowerCase();

            const filename =
              crypto.randomUUID() +
              "." +
              extension;

            const upload =
              await db.storage
                .from("student-photos")
                .upload(
                  filename,
                  file,
                  {
                    upsert:false,
                    contentType:file.type
                  }
                );

            if(upload.error){
              throw upload.error;
            }

            updates.photo_path =
              filename;
          }


          const {
            error
          } =
            await db
              .from("students")
              .update(updates)
              .eq("id",id);


          if(error){
            throw error;
          }


          await logActivity(
            "EDIT_STUDENT",
            "Edited student " +
            updates.full_name
          );


          closeModal();

          showToast(
            "Student updated.",
            "success"
          );

          await renderStudents();

        }catch(error){

          console.error(error);

          showToast(
            error.message,
            "error"
          );
        }
      }
    );
}

async function toggleRoom(id){

  const room =
    state.rooms.find(
      x=>x.id === id
    );

  if(!room){
    return;
  }

  const newStatus =
    room.status === "active"
      ? "inactive"
      : "active";


  try{

    const {
      error
    } =
      await db
        .from("rooms")
        .update({
          status:newStatus
        })
        .eq("id",id);


    if(error){
      throw error;
    }


    showToast(
      "Room status updated.",
      "success"
    );

    await renderRooms();

  }catch(error){

    showToast(
      error.message,
      "error"
    );
  }
}

                  )}

async function renderAttendance(){

  await loadAttendance();

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="card">

      <div class="toolbar">

        <input
          id="attendanceSearch"
          placeholder="Search student..."
          oninput="filterAttendance()"
        >

        <select
          id="attendanceStatus"
          onchange="filterAttendance()"
        >

          <option value="">
            All Status
          </option>

          <option value="Present">
            Present
          </option>

          <option value="Late">
            Late
          </option>

          <option value="Time Out">
            Time Out
          </option>

          <option value="Absent">
            Absent
          </option>

        </select>


        <input
          id="attendanceDate"
          type="date"
          onchange="filterAttendance()"
        >


        <button
          class="gold-btn"
          onclick="exportAttendanceExcel(state.attendance)"
        >
          Excel
        </button>


        <button
          class="secondary-btn"
          onclick="exportAttendancePDF(state.attendance)"
        >
          PDF
        </button>

      </div>


      <div id="attendanceTable">
        ${attendanceTableHTML(
          state.attendance
        )}
      </div>

    </div>
  `;
}


function filterAttendance(){

  const search =
    document
      .getElementById(
        "attendanceSearch"
      )
      .value
      .toLowerCase();

  const status =
    document
      .getElementById(
        "attendanceStatus"
      )
      .value;

  const date =
    document
      .getElementById(
        "attendanceDate"
      )
      .value;


  const filtered =
    state.attendance.filter(row=>{

      const studentName =
        row.students?.full_name || "";

      const studentId =
        row.students?.student_id_number || "";

      const matchesSearch =
        (
          studentName +
          " " +
          studentId
        )
        .toLowerCase()
        .includes(search);

      const matchesStatus =
        !status ||
        row.status === status;

      const matchesDate =
        !date ||
        String(row.timestamp)
          .slice(0,10) === date;

      return (
        matchesSearch &&
        matchesStatus &&
        matchesDate
      );
    });


  document.getElementById(
    "attendanceTable"
  ).innerHTML =
    attendanceTableHTML(filtered);
}

async function startSession(){

  const teacher =
    state.teachers.find(
      t=>t.auth_user_id === state.user.id
    );

  if(!teacher){
    showToast(
      "Teacher profile not found.",
      "error"
    );
    return;
  }


  const subjectId =
    document
      .getElementById(
        "sessionSubject"
      )
      .value;

  const section =
    document
      .getElementById(
        "sessionSection"
      )
      .value
      .trim();

  const roomId =
    document
      .getElementById(
        "sessionRoom"
      )
      .value;


  if(
    !subjectId ||
    !roomId
  ){
    showToast(
      "Select a subject and RFID room.",
      "error"
    );
    return;
  }


  const room =
    state.rooms.find(
      r=>r.id === roomId
    );


  try{

    const {
      data,
      error
    } =
      await db
        .from("attendance_sessions")
        .insert({
          teacher_id:teacher.id,
          subject_id:subjectId,
          room_id:roomId,
          reader_id:room.reader_id,
          course_section:section,
          start_time:new Date().toISOString(),
          status:"active"
        })
        .select()
        .single();


    if(error){
      throw error;
    }


    state.currentSession =
      data;


    document.getElementById(
      "scannerStatus"
    ).textContent =
      "Session Active - Waiting for RFID Scans";


    showToast(
      "Class session started.",
      "success"
    );

  }catch(error){

    showToast(
      error.message,
      "error"
    );
  }
}

              margin-top:10px;
              color:var(--muted);
              font-size:13px
            ">
              ${escapeHTML(
                a.subjects?.course_section ||
                "-"
              )}
            </div>

            ${
              a.rooms
              ? `
                <div style="
                  margin-top:8px;
                  color:var(--muted);
                  font-size:13px
                ">
                  Room:
                  ${escapeHTML(
                    a.rooms.room_name
                  )}
                </div>
              `
              : ""
            }

          </div>

        `).join("")
        : `
          <div class="card">
            <p style="color:var(--muted)">
              No subjects assigned.
            </p>
          </div>
        `
      }

    </div>
  `;
}

/* =========================================================
   STUDENT ATTENDANCE
========================================================= */

async function renderStudentAttendance(){

  const student =
    await getCurrentStudent();

  if(!student){
    return;
  }

  await loadAttendance();

  const records =
    state.attendance.filter(
      x=>x.student_id === student.id
    );


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="card">

      <div class="toolbar">

        <input
          id="studentAttendanceDate"
          type="date"
          onchange="filterStudentAttendance()"
        >

        <select
          id="studentAttendanceStatus"
          onchange="filterStudentAttendance()"
        >

          <option value="">
            All Status
          </option>

          <option value="Present">
            Present
          </option>

          <option value="Late">
            Late
          </option>

          <option value="Time Out">
            Time Out
          </option>

        </select>

      </div>


      <div id="studentAttendanceTable">

        ${attendanceTableHTML(
          records
        )}

      </div>

    </div>
  `;


  window.studentRecords =
    records;
}


function filterStudentAttendance(){

  const date =
    document
      .getElementById(
        "studentAttendanceDate"
      )
      .value;

  const status =
    document
      .getElementById(
        "studentAttendanceStatus"
      )
      .value;


  const records =
    (window.studentRecords || [])
      .filter(row=>{

        return (
          (!date ||
            String(row.timestamp)
              .slice(0,10) === date
          ) &&
          (!status ||
            row.status === status
          )
        );
      });


  document.getElementById(
    "studentAttendanceTable"
  ).innerHTML =
    attendanceTableHTML(records);
}


/* =========================================================
   REPORTS
========================================================= */

async function renderReports(){

  await loadAttendance();

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="card">

      <div class="card-title">
        Attendance Reports
      </div>


      <div class="toolbar">

        <input
          id="reportFrom"
          type="date"
        >

        <input
          id="reportTo"
          type="date"
        >

        <button
          class="primary-btn"
          onclick="generateReport()"
        >
          Generate Report
        </button>

      </div>


      <div id="reportResult">
        <p style="color:var(--muted)">
          Select a date range and generate a report.
        </p>
      </div>

    </div>
  `;
}


function generateReport(){

  const from =
    document.getElementById(
      "reportFrom"
    ).value;

  const to =
    document.getElementById(
      "reportTo"
    ).value;


  const records =
    state.attendance.filter(row=>{

      const date =
        String(row.timestamp)
          .slice(0,10);

      return (
        (!from || date >= from) &&
        (!to || date <= to)
      );
    });


  document.getElementById(
    "reportResult"
  ).innerHTML = `

    <div class="toolbar">

      <button
        class="gold-btn"
        onclick="exportAttendanceExcel(window.currentReport)"
      >
        Export Excel
      </button>

      <button
        class="secondary-btn"
        onclick="exportAttendancePDF(window.currentReport)"
      >
        Export PDF
      </button>

    </div>


    ${attendanceTableHTML(records)}

  `;


  window.currentReport =
    records;
}

/* =========================================================
   SETTINGS
========================================================= */

async function renderSettings(){

  const {
    data,
    error
  } =
    await db
      .from("school_settings")
      .select("*")
      .limit(1)
      .maybeSingle();


  if(error){
    throw error;
  }


  const settings =
    data || {};


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="card">

      <div class="card-title">
        System Settings
      </div>


      <form id="settingsForm">

        <div class="grid-2">

          <div class="form-group">

            <label>
              School Name
            </label>

            <input
              id="schoolName"
              value="${escapeHTML(
                settings.school_name || ""
              )}"
            >

          </div>


          <div class="form-group">

            <label>
              School Year
            </label>

            <input
              id="schoolYear"
              value="${escapeHTML(
                settings.school_year || ""
              )}"
              placeholder="2026-2027"
            >

          </div>


          <div class="form-group">

            <label>
              Semester
            </label>

            <select id="schoolSemester">

              <option
                value="1st Semester"
                ${settings.semester==="1st Semester"?"selected":""}
              >
                1st Semester
              </option>

              <option
                value="2nd Semester"
                ${settings.semester==="2nd Semester"?"selected":""}
              >
                2nd Semester
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>
              Attendance Start
            </label>

            <input
              id="attendanceStart"
              type="time"
              value="${escapeHTML(
                settings.attendance_start || "18:00"
              )}"
            >

          </div>


          <div class="form-group">

            <label>
              Late Time
            </label>

            <input
              id="lateTime"
              type="time"
              value="${escapeHTML(
                settings.late_time || "18:15"
              )}"
            >

          </div>


          <div class="form-group">

            <label>
              Attendance End
            </label>

            <input
              id="attendanceEnd"
              type="time"
              value="${escapeHTML(
                settings.attendance_end || "05:59"
              )}"
            >

          </div>

        </div>


        <button class="primary-btn">
          Save Settings
        </button>

      </form>

    </div>
  `;


  document
    .getElementById("settingsForm")
    .addEventListener(
      "submit",
      async e=>{

        e.preventDefault();

        try{

          const values = {

            school_name:
              document.getElementById(
                "schoolName"
              ).value.trim(),

            school_year:
              document.getElementById(
                "schoolYear"
              ).value.trim(),

            semester:
              document.getElementById(
                "schoolSemester"
              ).value,

            attendance_start:
              document.getElementById(
                "attendanceStart"
              ).value,

            late_time:
              document.getElementById(
                "lateTime"
              ).value,

            attendance_end:
              document.getElementById(
                "attendanceEnd"
              ).value,

            updated_at:
              new Date().toISOString()
          };


          let result;


          if(settings.id){

            result =
              await db
                .from("school_settings")
                .update(values)
                .eq(
                  "id",
                  settings.id
                );

          }else{

            result =
              await db
                .from("school_settings")
                .insert(values);
          }


          if(result.error){
            throw result.error;
          }


          showToast(
            "Settings saved.",
            "success"
          );

        }catch(error){

          showToast(
            error.message,
            "error"
          );
        }
      }
    );
}


/* =========================================================
   EXPORT EXCEL
========================================================= */

function exportAttendanceExcel(records){

  if(!records || !records.length){

    showToast(
      "No attendance data to export.",
      "warning"
    );

    return;
  }


  const rows =
    records.map(row=>({

      Date:
        formatDate(
          row.timestamp
        ),

      Time:
        formatTime(
          row.timestamp
        ),

      "Student ID":
        row.students?.student_id_number ||
        "",

      Student:
        row.students?.full_name ||
        "",

      "Course / Section":
        row.students?.course_section ||
        "",

      Subject:
        row.subjects?.subject_code ||
        "",

      "Subject Name":
        row.subjects?.subject_name ||
        "",

      Status:
        row.status ||
        "",

      "RFID UID":
        row.scanned_rfid ||
        "",

      "Reader ID":
        row.reader_id ||
        ""

    }));


  const worksheet =
    XLSX.utils.json_to_sheet(rows);

  const workbook =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "Attendance"
  );


  XLSX.writeFile(
    workbook,
    "Global_Academy_Attendance.xlsx"
  );


  showToast(
    "Excel file exported.",
    "success"
  );
}


/* =========================================================
   EXPORT PDF
========================================================= */

function exportAttendancePDF(records){

  if(!records || !records.length){

    showToast(
      "No attendance data to export.",
      "warning"
    );

    return;
  }


  const {
    jsPDF
  } = window.jspdf;


  const doc =
    new jsPDF();


  doc.setFontSize(16);

  doc.text(
    "Global Academy Smart Attendance",
    14,
    18
  );


  doc.setFontSize(10);

  doc.text(
    "Attendance Report",
    14,
    25
  );


  const rows =
    records.map(row=>[

      formatDate(
        row.timestamp
      ),

      formatTime(
        row.timestamp
      ),

      row.students?.student_id_number ||
      "",

      row.students?.full_name ||
      "",

      row.subjects?.subject_code ||
      "",

      row.status ||
      "",

      row.reader_id ||
      ""

    ]);


  doc.autoTable({

    startY:32,

    head:[[
      "Date",
      "Time",
      "Student ID",
      "Student",
      "Subject",
      "Status",
      "Reader"
    ]],

    body:rows,

    styles:{
      fontSize:8
    }

  });


  doc.save(
    "Global_Academy_Attendance.pdf"
  );


  showToast(
    "PDF exported.",
    "success"
  );
}


/* =========================================================
   REAL-TIME ATTENDANCE
========================================================= */

function subscribeRealtime(){

  db
    .channel("attendance-live")
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"attendance_records"
      },
      async payload=>{

        console.log(
          "Attendance update:",
          payload
        );


        try{

          await loadAttendance();


          if(
            state.currentPage ===
            "attendance"
          ){

            document.getElementById(
              "attendanceTable"
            ).innerHTML =
              attendanceTableHTML(
                state.attendance
              );

          }


          if(
            state.currentPage ===
            "teacherAttendance"
          ){

            const element =
              document.getElementById(
                "teacherAttendanceTable"
              );

            if(element){

              element.innerHTML =
                attendanceTableHTML(
                  state.attendance
                );
            }

          }

        }catch(error){

          console.error(error);
        }

      }
    )
    .subscribe();


  db
    .channel("rooms-live")
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"rooms"
      },
      async()=>{
        try{
          await loadRooms();
        }catch(error){
          console.error(error);
        }
      }
    )
    .subscribe();
}
